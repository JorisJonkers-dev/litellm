# Model routes. A caller sends a canonical model name (mistral-large, glm-5.3, claude-sonnet-4-5)
# or <route>/<upstream model id>. Two layers answer it:
#   - the deployments catalog/sync.py generates into config/models.generated.yaml, included below:
#     one per (canonical model, account) the catalogue probed usable, grouped by canonical name and
#     ordered by catalog/routing.json. The sync opens a pull request against this repository, so a
#     route changes only when that pull request is merged and the image is redeployed. Nothing is
#     written to the proxy's database.
#   - the flat catch-all wildcards at the end, one per account, so an id the catalogue has not
#     deployed yet still reaches its provider.
# Credentials live in credential_list, one entry per account, and a deployment names its entry with
# litellm_params.litellm_credential_name. LiteLLM sends no credentials at all when the name does not
# exist, so tests/config.test.mjs fails on a dangling name. Every value is an environment name.
# Virtual keys restrict to a model pattern (models: ["vibe/*"]), which matches canonical names too,
# so no key changes when a deployment is added. Each cheap agent id gets its own virtual key
# (docs/LITELLM.md in agent-kit) restricted to its route and capped with max_budget.
#
#   vibe/*, vibe-study/*          the two Vibe plans (Mistral)
#   vibe-api/*, vibe-study-api/*  the two general Mistral API keys: more models, per token; the last
#                                 resort, deployed only for models no other route serves
#   opencode-go/*                 the OpenCode Go subscription, through LiteLLM's own opencode_go
#                                 provider: it picks the API family (Chat Completions, Responses,
#                                 Messages, Gemini) per model and prices every request from its
#                                 catalogue, so the UI shows the spend under OpenCode Go
#   local/*                       the OpenAI-compatible model server on the GPU workstation, free
#
# The free-tier openrouter route has no wildcard: only the generated deployments reach it, free ids
# only, each in its own "openrouter/<canonical>" group with the openrouter-free-public access group
# and never in `canonical`: a free-tier provider may train on the prompts, so it is public work only.
#
# No Zen (opencode.ai/zen/v1) route: only the Go base is configured. OpenCode's free models answer
# 403 to every client but OpenCode itself, so a free Zen route would serve nothing.
include: [models.generated.yaml]

credential_list:
  - credential_name: vibe
    credential_values: { api_key: os.environ/VIBE_API_KEY, api_base: os.environ/MISTRAL_API_BASE }
    credential_info: {}
  - credential_name: vibe-study
    credential_values: { api_key: os.environ/VIBE_STUDY_API_KEY, api_base: os.environ/MISTRAL_API_BASE }
    credential_info: {}
  - credential_name: vibe-api
    credential_values: { api_key: os.environ/VIBE_API_GENERAL_KEY, api_base: os.environ/MISTRAL_API_BASE }
    credential_info: {}
  - credential_name: vibe-study-api
    credential_values: { api_key: os.environ/VIBE_STUDY_API_GENERAL_KEY, api_base: os.environ/MISTRAL_API_BASE }
    credential_info: {}
  - credential_name: opencode-go
    # No api_base: one base serves one API family, and opencode_go chooses the base per model.
    credential_values: { api_key: os.environ/OPENCODE_GO_API_KEY }
    credential_info: {}
  - credential_name: openrouter
    credential_values: { api_key: os.environ/OPENROUTER_API_KEY, api_base: os.environ/OPENROUTER_API_BASE }
    credential_info: {}
  - credential_name: local
    credential_values: { api_key: os.environ/LOCAL_LLM_API_KEY, api_base: os.environ/LOCAL_LLM_API_BASE }
    credential_info: {}
  # Free-only routes (agent-kit#916): no wildcard, only generated free deployments reach them.
  - credential_name: groq
    credential_values: { api_key: os.environ/GROQ_API_KEY, api_base: os.environ/GROQ_API_BASE }
    credential_info: {}
  # Cloudflare's base holds the account id, which LiteLLM's provider takes from CLOUDFLARE_ACCOUNT_ID.
  - credential_name: cloudflare
    credential_values: { api_key: os.environ/CLOUDFLARE_API_KEY }
    credential_info: {}
  - credential_name: nvidia
    credential_values: { api_key: os.environ/NVIDIA_NIM_API_KEY, api_base: os.environ/NVIDIA_NIM_API_BASE }
    credential_info: {}
  - credential_name: zai
    credential_values: { api_key: os.environ/ZAI_API_KEY, api_base: os.environ/ZAI_API_BASE }
    credential_info: {}
  # Kilo and OVHcloud need no account; LiteLLM wants some key, so they carry a placeholder, never sent by the sync.
  - credential_name: kilo
    credential_values: { api_key: os.environ/ANONYMOUS_UPSTREAM_KEY, api_base: os.environ/KILO_API_BASE }
    credential_info: {}
  - credential_name: ovh
    credential_values: { api_key: os.environ/ANONYMOUS_UPSTREAM_KEY, api_base: os.environ/OVHCLOUD_API_BASE }
    credential_info: {}
  - credential_name: requesty
    credential_values: { api_key: os.environ/REQUESTY_API_KEY, api_base: os.environ/REQUESTY_API_BASE }
    credential_info: {}
  - credential_name: axforge
    credential_values: { api_key: os.environ/AXFORGE_API_KEY, api_base: os.environ/AXFORGE_API_BASE }
    credential_info: {}
  - credential_name: naga
    credential_values: { api_key: os.environ/NAGA_API_KEY, api_base: os.environ/NAGA_API_BASE }
    credential_info: {}
  - credential_name: routeway
    credential_values: { api_key: os.environ/ROUTEWAY_API_KEY, api_base: os.environ/ROUTEWAY_API_BASE }
    credential_info: {}
  - credential_name: inferbase
    credential_values: { api_key: os.environ/INFERBASE_API_KEY, api_base: os.environ/INFERBASE_API_BASE }
    credential_info: {}
  # Second-wave free-only routes (agent-kit#916, litellm#64): no wildcard, only generated free deployments reach them.
  # Cohere and watsonx carry the key only: the spec gives no base for either.
  - credential_name: bazaarlink
    credential_values: { api_key: os.environ/BAZAARLINK_API_KEY, api_base: os.environ/BAZAARLINK_API_BASE }
    credential_info: {}
  - credential_name: electronhub
    credential_values: { api_key: os.environ/ELECTRONHUB_API_KEY, api_base: os.environ/ELECTRONHUB_API_BASE }
    credential_info: {}
  - credential_name: unorouter
    credential_values: { api_key: os.environ/ANONYMOUS_UPSTREAM_KEY, api_base: os.environ/UNOROUTER_API_BASE }
    credential_info: {}
  - credential_name: cohere
    credential_values: { api_key: os.environ/COHERE_API_KEY }
    credential_info: {}
  - credential_name: airforce
    credential_values: { api_key: os.environ/AIRFORCE_API_KEY, api_base: os.environ/AIRFORCE_API_BASE }
    credential_info: {}
  - credential_name: plugsky
    credential_values: { api_key: os.environ/PLUGSKY_API_KEY, api_base: os.environ/PLUGSKY_API_BASE }
    credential_info: {}
  - credential_name: poe
    credential_values: { api_key: os.environ/POE_API_KEY, api_base: os.environ/POE_API_BASE }
    credential_info: {}
  - credential_name: vercel
    credential_values: { api_key: os.environ/VERCEL_AI_GATEWAY_API_KEY, api_base: os.environ/VERCEL_AI_GATEWAY_API_BASE }
    credential_info: {}
  - credential_name: watsonx
    credential_values: { api_key: os.environ/WATSONX_API_KEY }
    credential_info: {}
  - credential_name: novita
    credential_values: { api_key: os.environ/NOVITA_API_KEY, api_base: os.environ/NOVITA_API_BASE }
    credential_info: {}
  - credential_name: together
    credential_values: { api_key: os.environ/TOGETHER_API_KEY, api_base: os.environ/TOGETHER_API_BASE }
    credential_info: {}
  - credential_name: typhoon
    credential_values: { api_key: os.environ/TYPHOON_API_KEY, api_base: os.environ/TYPHOON_API_BASE }
    credential_info: {}
  - credential_name: sealion
    credential_values: { api_key: os.environ/SEALION_API_KEY, api_base: os.environ/SEALION_API_BASE }
    credential_info: {}
  - credential_name: gonka
    credential_values: { api_key: os.environ/GONKA_API_KEY, api_base: os.environ/GONKA_API_BASE }
    credential_info: {}
  - credential_name: longcat
    credential_values: { api_key: os.environ/LONGCAT_API_KEY, api_base: os.environ/LONGCAT_API_BASE }
    credential_info: {}
  - credential_name: neosantara
    credential_values: { api_key: os.environ/NEOSANTARA_API_KEY, api_base: os.environ/NEOSANTARA_API_BASE }
    credential_info: {}
  # Google and Anthropic are addressed by LiteLLM itself, so their credential carries the key only.
  - credential_name: google
    credential_values: { api_key: os.environ/GEMINI_API_KEY }
    credential_info: {}
  - credential_name: anthropic
    credential_values: { api_key: os.environ/ANTHROPIC_API_KEY }
    credential_info: {}

model_list:
  - model_name: vibe/*
    litellm_params: { model: mistral/*, litellm_credential_name: vibe }
    model_info: { account: vibe, health_check_model: mistral/mistral-small-latest }
  - model_name: vibe-study/*
    litellm_params: { model: mistral/*, litellm_credential_name: vibe-study }
    model_info: { account: vibe-study, health_check_model: mistral/mistral-small-latest }
  - model_name: vibe-api/*
    litellm_params: { model: mistral/*, litellm_credential_name: vibe-api }
    model_info: { account: vibe-api, health_check_model: mistral/mistral-small-latest }
  - model_name: vibe-study-api/*
    litellm_params: { model: mistral/*, litellm_credential_name: vibe-study-api }
    model_info: { account: vibe-study-api, health_check_model: mistral/mistral-small-latest }
  - model_name: opencode-go/*
    litellm_params: { model: opencode_go/*, litellm_credential_name: opencode-go, extra_headers: { x-opencode-session: litellm-proxy } }
    model_info: { account: opencode-go, health_check_model: opencode_go/glm-5.3-flash }
  - model_name: local/*
    litellm_params: { model: openai/*, litellm_credential_name: local }
  # No openrouter/* wildcard: OpenRouter is free only, and a suffix wildcard such as
  # `openrouter/*:free` is not verified against the pinned release, so the sync's generated
  # deployments are the only way to reach an OpenRouter model.

litellm_settings:
  telemetry: false
  drop_params: true
  # /v1/models asks each provider for its model list (with the route's own key) instead of
  # listing only the models LiteLLM has a price for.
  check_provider_endpoint: true
  # Telemetry is metadata only: model, key alias, tokens, cost, latency, status. This switch
  # blanks prompts and responses in every logging callback, the OTel spans included.
  turn_off_message_logging: true
  # Prometheus (open source in this release) and OpenTelemetry traces.
  # tier_telemetry.py (shipped beside this file) adds litellm_tier_served_total: requested tier
  # against the serving deployment, priced or not, fallback or not; and the same record in the spend log.
  # account_budget.py (shipped beside this file) caps each paid account once across its deployments, from
  # catalog/routing.json `accounts`: see AGENTS.md, Budgets.
  # free_limits.py (shipped beside this file) keeps a free deployment out of the pick while its provider limit
  # lasts (counted windows from catalog/routing.json `free_limits`, and limits learned from 429s, 402s and
  # x-ratelimit-* headers), and lets it back in at reset: see AGENTS.md, Free groups.
  callbacks: ["prometheus", "otel", "tier_telemetry.tier_telemetry", "account_budget.account_budget", "free_limits.free_limits"]
  # Only these series are emitted, with these labels: no user, e-mail, client address or agent.
  # model_id and api_provider name the deployment that served a request, so a canonical model's
  # fallback is visible per request (the spend log already stores both).
  prometheus_metrics_config:
    - group: spend-and-tokens
      metrics:
        - litellm_spend_metric
        - litellm_total_tokens_metric
        - litellm_input_tokens_metric
        - litellm_output_tokens_metric
        - litellm_request_total_latency_metric
      include_labels: [api_key_alias, requested_model]
    - group: requests
      metrics: [litellm_proxy_total_requests_metric]
      include_labels: [api_key_alias, requested_model, status_code, model_id, api_provider]
    - group: errors
      metrics: [litellm_proxy_failed_requests_metric]
      include_labels: [api_key_alias, requested_model, exception_status, model_id, api_provider]
    - group: budgets
      metrics: [litellm_remaining_api_key_budget_metric, litellm_api_key_max_budget_metric, litellm_api_key_budget_remaining_hours_metric]
      include_labels: [api_key_alias]
    # Setup mints each agent key into its route's team, and the team holds the budget (the keys
    # have none of their own), so the budget alerts read these. Labelled by the team's alias
    # (the route's name) only, never its id.
    - group: team-budgets
      metrics: [litellm_remaining_team_budget_metric, litellm_team_max_budget_metric, litellm_team_budget_remaining_hours_metric]
      include_labels: [team_alias]

router_settings:
  # A canonical model's deployments are tried by their `order`, lowest first. A 402 or 429 quota
  # answer cools a deployment down for its own litellm_params.cooldown_time and the next order
  # level serves, so a spent plan falls through instead of failing the request. That cooldown and
  # the allowed-fails policies live in the generated file, per deployment: a 402 or 429 cools a
  # deployment in a group of two or more, and a group of exactly one carries an explicit
  # RateLimitErrorAllowedFails policy so it cools too. A free deployment carries no fixed cooldown (it would
  # override the provider's Retry-After): it cools for Retry-After, or the router default without one, and
  # free_limits.py keeps it out until its limit resets. Its rpm, tpm, rpd, tpd, daily_reset_time and
  # max_parallel_requests come from routing.json `free_limits`, and enforce_model_rate_limits (LiteLLM
  # 1.109.1, router_utils/pre_call_checks/model_rate_limit_check.py) holds each deployment to them strictly.
  optional_pre_call_checks: [router_budget_limiting, enforce_model_rate_limits]
  # num_retries stays above 0: inside a free/<canonical> group a 429 cools the copy that answered it
  # (its own cooldown_time), and the retry is what lands on the next free copy.
  num_retries: 2
  # Tier names (tier-free, tier-vibe, tier-go-cheap, tier-strong-open, tier-review): each is an alias of
  # its first step, and its other steps are its ordered fallbacks. The tiers are defined in
  # catalog/routing.json (tier_groups) and this block is rendered from them. There is no
  # default_fallbacks, and no fallbacks entry for a free/* group: nothing reachable from a free
  # group ends at a paid deployment. enforce_fallback_model_access (on by default) skips a step the
  # calling key does not hold, which is how a key's models list stops a chain.
  # BEGIN tiers (rendered from catalog/routing.json by `python3 catalog/sync.py --render-tiers`; do not edit by hand)
  model_group_alias:
    "tier-free": "free/hy4-flash"
    "tier-vibe": "vibe-tier/deepseek-v4-1-flash-1017"
    "tier-go-cheap": "opencode-go-tier/deepseek-v4.1-flash"
    "tier-strong-open": "opencode-go-tier/qwen4-max"
    "tier-review": "free/nemotron-3-ultra-550b-a55b"
  fallbacks:
    - {"tier-free": ["free/longcat-2.5", "free/beam-1.0-501b-a23b", "free/glm-4.7-flash", "free/qwen3.8-27b"]}
    - {"tier-vibe": ["vibe-tier/zai-glm-5-3-flash", "vibe-tier/mistral-small-2603", "opencode-go-tier/deepseek-v4.1-flash", "opencode-go-tier/glm-5.3-flash", "opencode-go-tier/mimo-v2.6-flash"]}
    - {"tier-go-cheap": ["opencode-go-tier/glm-5.3-flash", "opencode-go-tier/mimo-v2.6-flash"]}
    - {"tier-strong-open": ["vibe-tier/zai-glm-5-3", "opencode-go-tier/kimi-k3.1-pro", "opencode-go-tier/gpt-6-luna", "vibe-tier/deepseek-v4-1-flash-1017", "vibe-tier/zai-glm-5-3-flash", "vibe-tier/mistral-small-2603", "opencode-go-tier/deepseek-v4.1-flash", "opencode-go-tier/glm-5.3-flash", "opencode-go-tier/mimo-v2.6-flash"]}
    - {"tier-review": ["free/gemma-4-31b-it", "free/glm-4.7-flash", "free/gpt-oss-120b", "vibe-tier/deepseek-v4-1-flash-1017", "vibe-tier/zai-glm-5-3-flash", "opencode-go-tier/qwen3.8-flash", "opencode-go-tier/minimax-m3.1-flash", "opencode-go-tier/mimo-v2.6-flash"]}
  # END tiers

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # The virtual key is a standard `Authorization: Bearer sk-...`. The x-litellm-api-key header is
  # always accepted too (LiteLLM hard-codes it, and it wins over Authorization), which keeps
  # callers that still send it, with an edge token as the bearer, working.
  allow_requests_on_db_unavailable: false
  # The admin UI signs in through SSO only (auth-api). The username and password login, and the
  # master key as its fallback password, are off; the master key still works as an API bearer.
  disable_env_credential_login: true
  # Only proxy admins (ROLE_ADMIN at auth-api) and proxy admin viewers may sign in to the UI.
  ui_access_mode: admin_only
  # The spend log keeps cost and token counts, never the request or response body.
  store_prompts_in_spend_logs: false
