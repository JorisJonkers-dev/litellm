# Model routes. A caller sends a canonical model name (mistral-large, glm-5.3, claude-sonnet-4-5)
# or <route>/<upstream model id>. Two layers answer it:
#   - the deployments catalog/sync.py generates into config/models.generated.yaml, included below:
#     one per (canonical model, account) the catalogue probed usable, grouped by canonical name and
#     ordered by catalog/routing.json. The sync opens a pull request against this repository, so a
#     route changes only when that pull request is merged and the image is redeployed. Nothing is
#     written to the proxy's database.
#   - the flat catch-all wildcards at the end, one per account, so an id the catalogue has not
#     deployed yet still reaches its provider.
# Credentials live in credential_list, one entry per account, and a deployment names its entry with
# litellm_params.litellm_credential_name. LiteLLM sends no credentials at all when the name does not
# exist, so tests/config.test.mjs fails on a dangling name. Every value is an environment name.
# Virtual keys restrict to a model pattern (models: ["vibe/*"]), which matches canonical names too,
# so no key changes when a deployment is added. Each cheap agent id gets its own virtual key
# (docs/LITELLM.md in agent-kit) restricted to its route and capped with max_budget.
#
#   vibe/*, vibe-study/*          the two Vibe plans (Mistral)
#   vibe-api/*, vibe-study-api/*  the two general Mistral API keys: more models, per token
#   opencode-go/*                 the OpenCode Go provider (OpenAI-compatible)
#   local/*                       the OpenAI-compatible model server on the GPU workstation, free
#
# No Zen (opencode.ai/zen/v1) route: only the Go base is configured.
include: [models.generated.yaml]

credential_list:
  - credential_name: vibe
    credential_values: { api_key: os.environ/VIBE_API_KEY, api_base: os.environ/MISTRAL_API_BASE }
    credential_info: {}
  - credential_name: vibe-study
    credential_values: { api_key: os.environ/VIBE_STUDY_API_KEY, api_base: os.environ/MISTRAL_API_BASE }
    credential_info: {}
  - credential_name: vibe-api
    credential_values: { api_key: os.environ/VIBE_API_GENERAL_KEY, api_base: os.environ/MISTRAL_API_BASE }
    credential_info: {}
  - credential_name: vibe-study-api
    credential_values: { api_key: os.environ/VIBE_STUDY_API_GENERAL_KEY, api_base: os.environ/MISTRAL_API_BASE }
    credential_info: {}
  - credential_name: opencode-go
    credential_values: { api_key: os.environ/OPENCODE_GO_API_KEY, api_base: os.environ/OPENCODE_GO_API_BASE }
    credential_info: {}
  - credential_name: openrouter
    credential_values: { api_key: os.environ/OPENROUTER_API_KEY, api_base: os.environ/OPENROUTER_API_BASE }
    credential_info: {}
  - credential_name: local
    credential_values: { api_key: os.environ/LOCAL_LLM_API_KEY, api_base: os.environ/LOCAL_LLM_API_BASE }
    credential_info: {}
  # Google and Anthropic are addressed by LiteLLM itself, so their credential carries the key only.
  - credential_name: google
    credential_values: { api_key: os.environ/GEMINI_API_KEY }
    credential_info: {}
  - credential_name: anthropic
    credential_values: { api_key: os.environ/ANTHROPIC_API_KEY }
    credential_info: {}

model_list:
  - model_name: vibe/*
    litellm_params: { model: mistral/*, litellm_credential_name: vibe }
    model_info: { health_check_model: mistral/mistral-small-latest }
  - model_name: vibe-study/*
    litellm_params: { model: mistral/*, litellm_credential_name: vibe-study }
    model_info: { health_check_model: mistral/mistral-small-latest }
  - model_name: vibe-api/*
    litellm_params: { model: mistral/*, litellm_credential_name: vibe-api }
    model_info: { health_check_model: mistral/mistral-small-latest }
  - model_name: vibe-study-api/*
    litellm_params: { model: mistral/*, litellm_credential_name: vibe-study-api }
    model_info: { health_check_model: mistral/mistral-small-latest }
  - model_name: opencode-go/*
    litellm_params: { model: openai/*, litellm_credential_name: opencode-go, extra_headers: { x-opencode-session: litellm-proxy } }
    model_info: { health_check_model: openai/glm-5.3-flash }
  - model_name: local/*
    litellm_params: { model: openai/*, litellm_credential_name: local }
  # No openrouter/* wildcard: OpenRouter is free only, and a suffix wildcard such as
  # `openrouter/*:free` is not verified against the pinned release, so the sync's generated
  # deployments are the only way to reach an OpenRouter model.

litellm_settings:
  telemetry: false
  drop_params: true
  # /v1/models asks each provider for its model list (with the route's own key) instead of
  # listing only the models LiteLLM has a price for.
  check_provider_endpoint: true
  # Telemetry is metadata only: model, key alias, tokens, cost, latency, status. This switch
  # blanks prompts and responses in every logging callback, the OTel spans included.
  turn_off_message_logging: true
  # Prometheus (open source in this release) and OpenTelemetry traces.
  callbacks: ["prometheus", "otel"]
  # Only these series are emitted, with these labels: no user, e-mail, client address or agent.
  # model_id and api_provider name the deployment that served a request, so a canonical model's
  # fallback is visible per request (the spend log already stores both).
  prometheus_metrics_config:
    - group: spend-and-tokens
      metrics:
        - litellm_spend_metric
        - litellm_total_tokens_metric
        - litellm_input_tokens_metric
        - litellm_output_tokens_metric
        - litellm_request_total_latency_metric
      include_labels: [api_key_alias, requested_model]
    - group: requests
      metrics: [litellm_proxy_total_requests_metric]
      include_labels: [api_key_alias, requested_model, status_code, model_id, api_provider]
    - group: errors
      metrics: [litellm_proxy_failed_requests_metric]
      include_labels: [api_key_alias, requested_model, exception_status, model_id, api_provider]
    - group: budgets
      metrics: [litellm_remaining_api_key_budget_metric, litellm_api_key_max_budget_metric]
      include_labels: [api_key_alias]

router_settings:
  # A canonical model's deployments are tried by their `order`, lowest first. A 402 or 429 quota
  # answer cools a deployment down for its own litellm_params.cooldown_time and the next order
  # level serves, so a spent plan falls through instead of failing the request. That cooldown and
  # the allowed-fails policies live in the generated file, per deployment: a 402 or 429 cools a
  # deployment in a group of two or more, and a group of exactly one carries an explicit
  # RateLimitErrorAllowedFails policy so it cools too. No rate limits are set.
  optional_pre_call_checks: [router_budget_limiting]
  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # The virtual key travels in this header; Authorization carries the edge's service token.
  litellm_key_header_name: x-litellm-api-key
  allow_requests_on_db_unavailable: false
  # The admin UI signs in through SSO only (auth-api). The username and password login, and the
  # master key as its fallback password, are off; the master key still works as an API bearer.
  disable_env_credential_login: true
  # Only proxy admins (ROLE_ADMIN at auth-api) and proxy admin viewers may sign in to the UI.
  ui_access_mode: admin_only
  # The spend log keeps cost and token counts, never the request or response body.
  store_prompts_in_spend_logs: false
