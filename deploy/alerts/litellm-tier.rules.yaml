# Alert rules for the tier telemetry (litellm#62). The monitoring stack owns the alert rules
# (estate platform/observability/rules/litellm.yaml), so this file is the source: copy its group
# into that file, where the estate's own rule validation takes it. It is tested here with
# promtool (deploy/alerts/litellm-tier.rules.test.yaml, run by tests/alerts.test.mjs).
#
# litellm_tier_served_total comes from config/tier_telemetry.py, one count per served request:
#   requested_group  tier-free, or <route>/* for a free route (free/*, google-free/*, ...)
#   api_key_alias    the key; free and openrouter keys (free@<host>, openrouter@<host>) hold
#                    public-only groups with no paid deployment in them
#   priced           "true" when the serving deployment has a price
# The public key is left out on purpose: its public/<canonical> groups end in paid deployments by
# design (agent-kit docs/LITELLM.md), so a paid answer there is the plan, not a leak.
groups:
  - name: litellm-tier
    rules:
      - alert: LiteLLMFreeTierPaidLeak
        expr: |
          sum by (requested_group, api_key_alias, api_provider, model_id) (
            increase(litellm_tier_served_total{priced="true", requested_group=~"tier-free|free/\\*|google-free/\\*|openrouter/\\*|opencode-go-free/\\*"}[10m])
          ) > 0
          or
          sum by (requested_group, api_key_alias, api_provider, model_id) (
            increase(litellm_tier_served_total{priced="true", api_key_alias=~"(free|openrouter)@.*"}[10m])
          ) > 0
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "A free-tier request was served by a priced deployment ({{ $labels.api_provider }}, {{ $labels.model_id }})"
          description: >-
            A request to {{ $labels.requested_group }} from key {{ $labels.api_key_alias }} was answered by
            the priced deployment {{ $labels.model_id }} at {{ $labels.api_provider }}. A free tier must fail
            or fall through to another free deployment, never bill: check the group's members and fallbacks
            in the generated config.
