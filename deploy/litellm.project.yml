# deploy-kit Project Intent for litellm, the one LiteLLM proxy the estate's cheap agents reach
# their models through, from both workstations (agent-kit#454). It holds each agent id's
# virtual key and its hard budget, in litellm_db on the platform's Postgres. The model routes are
# not in the database: the proxy reads them from the generated config the image carries
# (config/models.generated.yaml), which the catalogue sync opens a pull request for.
#
# Anonymous at the edge: LiteLLM authenticates every request itself, so a caller sends its
# LiteLLM virtual key as a standard `Authorization: Bearer sk-...` from any client, with no
# edge sign-in or auth-api service token in front. (Forward-auth would take the bearer for
# its own token and refuse a LiteLLM key.) The admin UI (/ui) redirects straight to the
# auth-api sign-in (OIDC, the litellm client): ROLE_ADMIN is proxy admin, nobody else gets in,
# and there is no password login. No route is rate limited: this tier counts clients by the
# connection's address, which behind Cloudflare is its edge, so a limit would throttle everyone
# together. Virtual-key auth and each key's max_budget are the controls.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0

project: litellm # the namespace derives: litellm-system; the database: litellm_db
owner: joris

applications:
  - id: litellm
    migration: self # the proxy applies its pending Prisma migrations on start

    exposure:
      - name: api
        host: litellm.jorisjonkers.dev
        audience: anonymous
        routes:
          - { path: /, match: prefix, process: litellm, surface: http }

    # Prometheus metrics (LiteLLM's open-source prometheus callback), per key alias and model.
    # The path has the trailing slash because the metrics app redirects /metrics to it.
    observability:
      scrape: { process: litellm, surface: metrics, path: /metrics/ }

    # Grafana dashboard: spend, tokens, latency and errors per key and model.
    # The alert rules belong to the monitoring stack (estate platform/observability/rules).
    dashboards:
      - { from: dashboards/litellm.json }

    processes:
      - name: litellm
        lifecycle: application
        image: litellm # ghcr.io/jorisjonkers-dev/litellm; the lock resolves digest, uid and gid
        # python: the profile hands the process the telemetry collector's OTLP address
        # (OTEL_EXPORTER_OTLP_ENDPOINT) and its service name; LiteLLM's otel callback reads both.
        runtime: python

        provides:
          http: 4000
          metrics: 4001 # Prometheus, from its own process: no virtual-key auth, never routed

        dependsOn:
          - application: platform-postgres
            surface: postgres
            credentials: { delivery: env, rotation: { tolerates: restart } }

        egress:
          to: internet
          reason: >-
            The proxy calls the Mistral API (Vibe, Vibe-study and the two general keys), the OpenCode Go
            API, OpenCode Zen (its free models), OpenRouter, Google and Anthropic. The local/* route (the GPU workstation's model server) is not reachable
            by this declaration: the model has no edge to a host outside the cluster, and
            internet egress excludes every private and tailnet range (agent-kit follow-up).

        secrets:
          # Placeholder names: the owner writes the values with estate bootstrap/secrets.sh.
          # openrouter_api_key is the OpenRouter key made with a 5 EUR credit limit.
          # opencode_free_api_key is an OpenCode Zen API key on an account with no credit: the
          # opencode-free route deploys Zen's free models only.
          # master_key and salt_key are generated there; salt_key must never change once
          # virtual keys exist, because it encrypts the upstream keys stored in the database.
          # oidc_client_secret is the admin UI's client secret at auth-api, minted there with its copy
          # in secret/auth-api (auth.clients.litellm.secret).
          - path: secret/data/platform/litellm
            keys: [master_key, salt_key, oidc_client_secret, vibe_api_key, vibe_study_api_key, vibe_api_general_key, vibe_study_api_general_key, opencode_go_api_key, openrouter_api_key, opencode_free_api_key, google_api_key, anthropic_api_key]
            access: read
            delivery: env
            rotation: { tolerates: restart }

        placement:
          memory: 1Gi # LiteLLM with Prisma idles near 600Mi; confirm against the first week
          cpu: 250m

        # The image's user keeps Prisma's engine cache and a scratch directory under these.
        writablePaths: [/tmp, /app/.cache]

        probes:
          readiness: { path: /health/readiness, port: 4000 }
          liveness: { path: /health/liveliness, port: 4000 } # LiteLLM's spelling

        startupBudget: 300s # Prisma migrates the schema before the proxy serves
        cutover: continuous

  # The catalogue sync. Daily-fresh and cheap: it lists each route's models from its provider,
  # probes only the models that are new, errored or older than a day with one 1-token request at
  # the provider, and opens a pull request with the routing it planned (config/models.generated.yaml
  # in this repository) plus the published catalogue. catalog/sync.py documents the cost bound. It
  # runs the LiteLLM image's own Python; it serves nothing and never calls the proxy.
  - id: litellm-catalog
    processes:
      - name: litellm-catalog
        lifecycle: scheduled
        schedule: "17 * * * *" # hourly: lists every hour, probes what is new or a day old
        image: litellm
        runtime: none
        command: [/app/.venv/bin/python, /app/catalog/sync.py]
        egress:
          to: internet
          reason: >-
            Lists and probes models at the Mistral, OpenCode Go, OpenCode Zen, OpenRouter, Google and Anthropic APIs,
            publishes the catalogue to GitHub and opens the routing pull request there.
        secrets:
          # The same Vault path as the proxy: the provider keys list and probe each provider's
          # models, catalog_publish_token writes the catalogue repository, and catalog_pr_token
          # opens the pull request with the generated routing in this repository.
          - path: secret/data/platform/litellm
            keys: [vibe_api_key, vibe_study_api_key, vibe_api_general_key, vibe_study_api_general_key, opencode_go_api_key, openrouter_api_key, opencode_free_api_key, google_api_key, anthropic_api_key, catalog_publish_token, catalog_pr_token]
            access: read
            delivery: env
            rotation: { tolerates: restart }
        placement:
          memory: 128Mi
          cpu: 50m
