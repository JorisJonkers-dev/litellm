# Valkey for the LiteLLM proxy's coordination state: cooldowns, usage and spend counters, SSO
# PKCE verifiers. Everything in it is rebuilt by the proxy, so it is memory only: no snapshot, no
# append-only file, no volume. The password is appended by valkey-start.
bind * -::*
port 6379
protected-mode yes
dir /tmp
save ""
appendonly no

# The Process's memory limit is 256Mi: half of it for data, half for Valkey's own overhead,
# client buffers and fragmentation. The data stays well below this cap; past it the least
# recently used keys go, so a full store keeps accepting writes instead of failing them.
maxmemory 128mb
maxmemory-policy allkeys-lru

# The proxy never calls these, and CONFIG is how a client that has the password would rewrite
# the server's own settings. FLUSHALL stays: the router's cache flush calls it.
rename-command DEBUG ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
